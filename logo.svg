<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E7B35"/>
      <stop offset="100%" stop-color="#1E3F1A"/>
    </linearGradient>
    <linearGradient id="logoSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F49342"/>
      <stop offset="100%" stop-color="#D45D18"/>
    </linearGradient>
    <linearGradient id="logoWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#1B4F72"/>
    </linearGradient>
  </defs>
  <!-- Background circle with warm cream glow -->
  <circle cx="50" cy="50" r="46" fill="#FDF9F3" stroke="#E2D7C8" stroke-width="2"/>
  
  <!-- Sacred Peepal / Bodhi Leaf Silhouette -->
  <path d="M50 14 C62 26 80 40 76 64 C73 80 57 86 50 86 C43 86 27 80 24 64 C20 40 38 26 50 14 Z" fill="url(#logoLeaf)" opacity="0.95"/>
  
  <!-- Leaf Central Vein -->
  <path d="M50 18 L50 82" stroke="#A9DFBF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 34 Q60 42 66 40" stroke="#A9DFBF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M50 34 Q40 42 34 40" stroke="#A9DFBF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M50 48 Q62 56 68 54" stroke="#A9DFBF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M50 48 Q38 56 32 54" stroke="#A9DFBF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  
  <!-- Radiant Saffron Sun nested inside -->
  <circle cx="50" cy="46" r="14" fill="url(#logoSun)"/>
  <!-- Sun Rays -->
  <circle cx="50" cy="46" r="18" stroke="#F49342" stroke-width="1.5" stroke-dasharray="2 4" fill="none"/>
  
  <!-- Pure Water Droplet in the center of the sun -->
  <path d="M50 39 C53 43 56 46 56 49 C56 52.3 53.3 55 50 55 C46.7 55 44 52.3 44 49 C44 46 47 43 50 39 Z" fill="url(#logoWater)"/>
  <circle cx="48" cy="47" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>