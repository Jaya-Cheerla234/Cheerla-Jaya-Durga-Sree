<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tulsiBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF360C"/>
      <stop offset="50%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#tulsiBg)"/>
  
  <!-- Aura around Tulsi -->
  <circle cx="200" cy="110" r="85" fill="#FFF9C4" opacity="0.6"/>

  <!-- Traditional Ornate Tulsi Chaura (Courtyard Altar) -->
  <!-- Base Pedestal -->
  <polygon points="120,290 280,290 290,300 110,300" fill="#8D6E63"/>
  <rect x="130" y="260" width="140" height="30" fill="url(#potGrad)"/>
  <rect x="140" y="240" width="120" height="20" fill="#D84315"/>
  <polygon points="140,240 260,240 250,190 150,190" fill="url(#potGrad)"/>
  <!-- Top Rim of Pot -->
  <polygon points="135,190 265,190 270,180 130,180" fill="#FF7043"/>
  
  <!-- Sacred Niches (Ala) in Chaura with Small Diya -->
  <rect x="185" y="210" width="30" height="40" rx="15" fill="#4E342E"/>
  <!-- Diya inside niche -->
  <ellipse cx="200" cy="242" rx="10" ry="4" fill="#FFB300"/>
  <path d="M200 240 C202 235 204 230 200 224 C196 230 198 235 200 240 Z" fill="#FF5722"/>
  <circle cx="200" cy="232" r="1.5" fill="#FFF59D"/>

  <!-- Ornate Motifs on Altar -->
  <circle cx="160" cy="225" r="5" fill="#FFCCBC"/>
  <circle cx="240" cy="225" r="5" fill="#FFCCBC"/>
  <line x1="145" y1="260" x2="255" y2="260" stroke="#FFE082" stroke-width="2"/>

  <!-- Tulsi Stems & Branching -->
  <path d="M200 180 Q200 130 200 70" stroke="#33691E" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 150 Q170 130 145 110" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 150 Q230 130 255 110" stroke="#33691E" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 120 Q160 100 135 80" stroke="#33691E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200 120 Q240 100 265 80" stroke="#33691E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200 90 Q180 75 160 55" stroke="#33691E" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 90 Q220 75 240 55" stroke="#33691E" stroke-width="2" stroke-linecap="round"/>

  <!-- Serrated Sacred Tulsi Leaves (Clusters) -->
  <!-- Left Side Leaves -->
  <path d="M145 110 Q130 100 125 115 Q140 125 145 110 Z" fill="url(#leafGrad)"/>
  <path d="M135 80 Q115 75 115 90 Q130 95 135 80 Z" fill="url(#leafGrad)"/>
  <path d="M160 55 Q145 45 145 60 Q155 65 160 55 Z" fill="url(#leafGrad)"/>
  <path d="M170 130 Q155 125 155 140 Q168 142 170 130 Z" fill="url(#leafGrad)"/>

  <!-- Right Side Leaves -->
  <path d="M255 110 Q270 100 275 115 Q260 125 255 110 Z" fill="url(#leafGrad)"/>
  <path d="M265 80 Q285 75 285 90 Q270 95 265 80 Z" fill="url(#leafGrad)"/>
  <path d="M240 55 Q255 45 255 60 Q245 65 240 55 Z" fill="url(#leafGrad)"/>
  <path d="M230 130 Q245 125 245 140 Q232 142 230 130 Z" fill="url(#leafGrad)"/>

  <!-- Central & Apex Leaves -->
  <path d="M200 70 Q188 50 200 35 Q212 50 200 70 Z" fill="url(#leafGrad)"/>
  <path d="M190 95 Q178 85 185 75 Q198 85 190 95 Z" fill="url(#leafGrad)"/>
  <path d="M210 95 Q222 85 215 75 Q202 85 210 95 Z" fill="url(#leafGrad)"/>

  <!-- Sacred Manjari (Flower Spikes at top) -->
  <g fill="#7B1FA2">
    <circle cx="200" cy="32" r="2.5"/>
    <circle cx="198" cy="27" r="2"/>
    <circle cx="202" cy="22" r="2"/>
    <circle cx="200" cy="17" r="1.5"/>
  </g>
</svg>