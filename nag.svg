<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nagBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="100%" stop-color="#B2DFDB"/>
    </linearGradient>
    <linearGradient id="serpentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#nagBg)"/>
  
  <!-- Sacred Anthill / Forest Mound (Valmiki mound) -->
  <ellipse cx="200" cy="250" rx="140" ry="45" fill="#8D6E63"/>
  <ellipse cx="200" cy="265" rx="170" ry="35" fill="#6D4C41"/>
  
  <!-- Serpent Halo / Aura -->
  <circle cx="200" cy="110" r="70" fill="#E8F5E9" opacity="0.6"/>

  <!-- Five-Headed Sacred Cobra (Sheshnaga / Vasuki Silhouette) -->
  <!-- Flanking Hoods -->
  <!-- Left Outer Hood -->
  <path d="M140 130 C125 105 135 85 148 70 C155 85 155 110 150 130 Z" fill="#2E7D32" opacity="0.85"/>
  <!-- Left Inner Hood -->
  <path d="M165 125 C150 95 160 70 175 55 C182 75 180 105 175 125 Z" fill="#1B5E20" opacity="0.9"/>
  <!-- Right Outer Hood -->
  <path d="M260 130 C275 105 265 85 252 70 C245 85 245 110 250 130 Z" fill="#2E7D32" opacity="0.85"/>
  <!-- Right Inner Hood -->
  <path d="M235 125 C250 95 240 70 225 55 C218 75 220 105 225 125 Z" fill="#1B5E20" opacity="0.9"/>

  <!-- Main Central Hood & Head -->
  <path d="M165 110 C155 75 180 40 200 35 C220 40 245 75 235 110 C220 130 180 130 165 110 Z" fill="url(#serpentGrad)"/>
  
  <!-- Sacred Serpent Markings (Uraeus / Spectacle Mark) -->
  <circle cx="200" cy="75" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M190 75 Q200 88 210 75" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <circle cx="200" cy="65" r="2.5" fill="#FFD54F"/>

  <!-- Coiled Body descending -->
  <path d="M185 120 Q175 170 195 200 Q225 210 215 230 Q200 245 160 240 Q130 235 140 255 Q160 270 200 270 Q260 270 270 245 Q270 220 230 200 Q205 170 215 120 Z" fill="url(#serpentGrad)"/>

  <!-- Traditional Milk Offering Bowl (Katori) & Marigolds at base -->
  <ellipse cx="200" cy="275" rx="22" ry="8" fill="#FFC107" stroke="#FFA000" stroke-width="1.5"/>
  <ellipse cx="200" cy="273" rx="18" ry="6" fill="#FFFFFF"/>
  <!-- Marigold flowers beside bowl -->
  <circle cx="165" cy="272" r="5" fill="#FF9800"/>
  <circle cx="173" cy="276" r="4.5" fill="#F57C00"/>
  <circle cx="230" cy="272" r="5" fill="#FF9800"/>
  <circle cx="222" cy="276" r="4" fill="#F57C00"/>

  <!-- Lotus & Field Crop Silhouette on sides (symbolizing rodent protection) -->
  <path d="M60 260 Q70 230 65 210 Q75 235 90 255" stroke="#4CAF50" stroke-width="2" fill="none"/>
  <path d="M340 260 Q330 230 335 210 Q325 235 310 255" stroke="#4CAF50" stroke-width="2" fill="none"/>
</svg>