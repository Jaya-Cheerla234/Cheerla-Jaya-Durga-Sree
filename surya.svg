<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="40%" stop-color="#FFA000"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="50%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="30%" stop-color="#E06D26"/>
      <stop offset="100%" stop-color="#B84A1A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#skyGrad)"/>
  
  <!-- Outer Glow Halo -->
  <circle cx="200" cy="130" r="110" fill="url(#sunGlow)" opacity="0.6"/>
  <circle cx="200" cy="130" r="85" fill="#FFE082" opacity="0.4"/>
  
  <!-- Radiating Sacred Rays (12 Rays of Surya) -->
  <g stroke="#E65100" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="50" x2="200" y2="25"/>
    <line x1="200" y1="210" x2="200" y2="235"/>
    <line x1="120" y1="130" x2="95" y2="130"/>
    <line x1="280" y1="130" x2="305" y2="130"/>
    <line x1="143" y1="73" x2="125" y2="55"/>
    <line x1="257" y1="187" x2="275" y2="205"/>
    <line x1="143" y1="187" x2="125" y2="205"/>
    <line x1="257" y1="73" x2="275" y2="55"/>
    <!-- Intermediate decorative flames -->
    <path d="M200 62 L204 74 L196 74 Z" fill="#E65100"/>
    <path d="M200 198 L204 186 L196 186 Z" fill="#E65100"/>
    <path d="M132 130 L144 134 L144 126 Z" fill="#E65100"/>
    <path d="M268 130 L256 134 L256 126 Z" fill="#E65100"/>
  </g>
  
  <!-- Ornate Decorative Ring -->
  <circle cx="200" cy="130" r="64" fill="none" stroke="#F57C00" stroke-width="2" stroke-dasharray="3 4"/>
  <circle cx="200" cy="130" r="56" fill="url(#sunCore)"/>
  
  <!-- Traditional Gayatri Face / Bindu Motif -->
  <circle cx="200" cy="115" r="4" fill="#FFE082"/>
  <path d="M188 126 Q200 134 212 126" stroke="#FFE082" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tilak -->
  <path d="M200 95 C203 103 205 108 200 112 C195 108 197 103 200 95 Z" fill="#D32F2F"/>
  <circle cx="200" cy="111" r="1.5" fill="#FFEB3B"/>

  <!-- Morning Horizon Waters & Arghya Offering Silhouette -->
  <path d="M0 220 Q100 215 200 222 T400 218 L400 300 L0 300 Z" fill="url(#waterGrad)" opacity="0.9"/>
  <!-- Water Reflection Lines -->
  <ellipse cx="200" cy="235" rx="50" ry="3" fill="#FFF3E0" opacity="0.7"/>
  <ellipse cx="200" cy="245" rx="70" ry="2.5" fill="#FFE082" opacity="0.5"/>
  <ellipse cx="200" cy="255" rx="40" ry="2" fill="#FFF3E0" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="90" ry="2" fill="#FFE082" opacity="0.4"/>
  
  <!-- Lotus offering silhouette -->
  <path d="M190 270 Q200 255 210 270 Q200 266 190 270 Z" fill="#FFCDD2"/>
  <path d="M185 272 Q200 262 215 272 Q200 276 185 272 Z" fill="#F8BBD0"/>
</svg>