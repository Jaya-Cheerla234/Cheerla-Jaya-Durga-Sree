<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="prithviSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="60%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <radialGradient id="globeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="70%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="soilTiers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#prithviSky)"/>

  <!-- Halo of Life / Prana around Earth -->
  <circle cx="200" cy="120" r="95" fill="#E8F5E9" opacity="0.8"/>

  <!-- The Living Earth Globe (Bhumi Mandala) -->
  <circle cx="200" cy="120" r="70" fill="url(#oceanGrad)"/>

  <!-- Continents and Landmasses (Green Biosphere) -->
  <path d="M160 80 Q180 75 195 90 Q210 80 230 95 Q245 115 235 140 Q215 130 195 155 Q180 145 165 150 Q150 120 160 80 Z" fill="#43A047"/>
  <path d="M235 75 Q250 85 240 100 Q225 90 235 75 Z" fill="#388E3C"/>
  <path d="M150 130 Q140 140 145 160 Q160 170 170 155 Z" fill="#388E3C"/>
  
  <!-- Atmosphere Cloud swirls -->
  <path d="M145 95 Q175 105 200 85 Q225 110 250 100" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M160 145 Q190 135 215 150 Q235 135 245 145" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Revering Protective Hands / Lotus Cup Supporting the Earth -->
  <!-- Left Supporting Hand/Lotus Petal -->
  <path d="M120 180 C110 130 145 180 180 195 C150 205 130 200 120 180 Z" fill="#81C784"/>
  <!-- Right Supporting Hand/Lotus Petal -->
  <path d="M280 180 C290 130 255 180 220 195 C250 205 270 200 280 180 Z" fill="#81C784"/>
  <!-- Central Lotus Base -->
  <path d="M170 195 Q200 185 230 195 Q200 215 170 195 Z" fill="#66BB6A"/>

  <!-- Rich Living Topsoil Cross-Section (Humus, Roots, Seedlings) -->
  <rect x="0" y="210" width="400" height="90" fill="url(#soilTiers)"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#8D6E63" stroke-width="4"/>

  <!-- Golden Sprouting Seedlings (Ankur) representing Raja Parba rejuvenation -->
  <g transform="translate(60, 195)">
    <!-- Stem -->
    <path d="M20 25 Q20 5 25 0" stroke="#7CB342" stroke-width="2.5" fill="none"/>
    <!-- Two baby leaves -->
    <path d="M25 0 Q15 -5 15 -12 Q23 -8 25 0 Z" fill="#8BC34A"/>
    <path d="M25 0 Q35 -5 35 -12 Q27 -8 25 0 Z" fill="#9CCC65"/>
  </g>
  <g transform="translate(300, 195)">
    <!-- Stem -->
    <path d="M20 25 Q20 5 25 0" stroke="#7CB342" stroke-width="2.5" fill="none"/>
    <!-- Two baby leaves -->
    <path d="M25 0 Q15 -5 15 -12 Q23 -8 25 0 Z" fill="#8BC34A"/>
    <path d="M25 0 Q35 -5 35 -12 Q27 -8 25 0 Z" fill="#9CCC65"/>
  </g>

  <!-- Traditional Rangoli / Kolam Rice Powder Marking on Earth -->
  <g stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.75" transform="translate(160, 240)">
    <circle cx="40" cy="25" r="15"/>
    <line x1="20" y1="25" x2="60" y2="25"/>
    <line x1="40" y1="5" x2="40" y2="45"/>
    <polygon points="40,10 55,25 40,40 25,25"/>
  </g>
</svg>